<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1044610166642937" crossorigin="anonymous"></script>
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        background: transparent; 
      }
      div:empty { display: none; }
    </style>
  </head>
  <body>
    <!-- Fallback text to ensure iframe is loading -->
    <div id="loading-text" style="text-align: center; padding: 20px; color: #666; font-family: sans-serif; font-size: 14px;">
      Advertisement Loading...
    </div>
    
    <!-- Google AdSense -->
    <ins class="adsbygoogle"
         style="display:block; width:100%; min-height: 250px;"
         data-ad-client="ca-pub-1044610166642937"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
    
    <script>
      // Notify parent about ad status
      window.onload = function() {
        const ins = document.querySelector('ins.adsbygoogle');
        if (!ins) return;
        
        // Setup observer to check for ad-status
        const observer = new MutationObserver(mutations => {
          mutations.forEach(mutation => {
            if (mutation.attributeName === 'data-ad-status') {
              const status = ins.getAttribute('data-ad-status');
              window.parent.postMessage({ type: 'ad-status', status: status }, '*');
            }
          });
        });
        
        observer.observe(ins, { attributes: true });
        
        // Check if AdSense script is blocked by checking if adsbygoogle is still an array after some time
        setTimeout(() => {
           if (typeof window.adsbygoogle === 'undefined' || Array.isArray(window.adsbygoogle)) {
               window.parent.postMessage({ type: 'ad-status', status: 'blocked' }, '*');
           }
        }, 3000);
      };

      // Send height to parent to auto-adjust
      const resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            // Remove the Loading text if height changed
            const loadingText = document.getElementById('loading-text');
            if (loadingText && document.body.scrollHeight > 100) {
              loadingText.style.display = 'none';
            }
            window.parent.postMessage({ type: 'ad-resize', height: document.body.scrollHeight }, '*');
        }
      });
      resizeObserver.observe(document.body);
    </script>
  </body>
</html>
