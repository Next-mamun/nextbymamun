<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1044610166642937" crossorigin="anonymous"></script>
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        background: transparent;
        font-family: sans-serif;
      }
      .ad-container {
        width: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="ad-container">
      <ins class="adsbygoogle"
           style="display:block; width:100%; height:100vh;"
           data-ad-client="ca-pub-1044610166642937"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
    <script>
      // Automatically hide the ad reel if it doesn't load within 3 seconds
      // Or if the container height becomes 0 (AdSense collapses unfilled ads)
      let emptyReported = false;
      const urlParams = new URLSearchParams(window.location.search);
      const adId = urlParams.get('id');

      const checkEmpty = () => {
         if (emptyReported) return;
         const ins = document.querySelector('ins.adsbygoogle');
         if (!ins) return;

         if (ins.getAttribute('data-ad-status') === 'unfilled') {
            emptyReported = true;
            window.parent.postMessage({ type: 'ad-empty', id: adId }, '*');
         }
      };

      const observer = new MutationObserver((mutations) => {
         checkEmpty();
      });

      const ins = document.querySelector('ins.adsbygoogle');
      if (ins) {
        observer.observe(ins, { attributes: true, attributeFilter: ['data-ad-status'] });
      }

      setTimeout(() => {
        if (!emptyReported) {
          const insRect = ins ? ins.getBoundingClientRect() : null;
          if (!insRect || insRect.height < 50) {
             emptyReported = true;
             window.parent.postMessage({ type: 'ad-empty', id: adId }, '*');
          } else {
             window.parent.postMessage({ type: 'ad-filled', id: adId }, '*');
          }
        }
      }, 3000);
    </script>
  </body>
</html>
