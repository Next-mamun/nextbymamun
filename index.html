
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, interactive-widget=resizes-content">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Next</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#1877F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Next">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1044610166642937" crossorigin="anonymous"></script>
  <script>
    (function() {
      try {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isAndroid = /android/i.test(userAgent);
        var isBot = /bot|googlebot|crawler|spider|robot|crawling|facebook|twitter|whatsapp|telegram/i.test(userAgent);
        var path = window.location.pathname;
        var search = window.location.search;
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
        var isWebview = (userAgent.indexOf('wv') > -1) || (userAgent.indexOf('Android') > -1 && userAgent.indexOf('Version/') > -1) || userAgent.indexOf('Themes') > -1;

        if (isAndroid && !isBot && !isStandalone && !isWebview && search.indexOf('fallback=1') === -1 && search.indexOf('app=1') === -1) {
          // Check if it's a sharable content path
          if (path.startsWith('/post') || path.startsWith('/reels') || path.startsWith('/messages')) {
            var fallbackUrl = window.location.href + (search ? '&' : '?') + 'fallback=1';
            // Trigger Android intent
            var intentUrl = "intent://" + window.location.host + path + search + "#Intent;scheme=https;package=next.isbest;S.browser_fallback_url=" + encodeURIComponent(fallbackUrl) + ";end";
            window.location.replace(intentUrl);
          }
        }
      } catch (e) { console.error('Deep link error', e); }
    })();
  </script>
</head>
<body class="overflow-x-hidden bg-[#f0f2f5]">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
